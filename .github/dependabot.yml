# Dependabot on this repository keeps the security alerts for every ecosystem
# QUON ships and opens no version-update pull requests: dependency updates are
# batched into releases. A limit of 0 is how version updates are switched off
# per ecosystem while the ecosystem stays registered.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "pip"
    directory: "/quon-scrubber-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "docker"
    directory: "/quon-scrubber-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
