name: Supply chain

# Runs where CI_RUNNER says, same switch as ci.yml. On the hosted pool these
# jobs are the first to hit an exhausted GitHub Actions allowance: a job that
# fails in seconds with zero steps executed is that, not a finding, and it
# means the vulnerability scan, licence gate and SBOM silently stop running.
# Self-hosted minutes are free, which removes the cause rather than papering
# over it.
#
# Same rule as ci.yml: never set CI_RUNNER on a public repository.
#
# Also the same rule on caching: an empty `cache:` input disables it, because
# a GitHub cache round-trip from the self-hosted runner costs a 1.2 MB/s uplink
# to re-fetch directories that box already keeps. See ci.yml's header.

# SBOM + license + known-vulnerability compliance for both ecosystems (npm
# frontend, pip backend). Runs on PRs and pushes to main, plus a weekly schedule
# so newly-disclosed CVEs against unchanged code are still caught. The license
# and vulnerability jobs GATE (fail the build); the SBOM is published as an
# artifact each run (the machine-readable inventory an EU-CRA / procurement
# review expects).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Same one-lane discipline as ci.yml: a newer run supersedes, a hang cannot
# hold the lane. The weekly scheduled run gets its own group so a Monday scan
# is never cancelled by an unrelated push.
concurrency:
  group: supply-${{ github.event_name == 'schedule' && 'cron' || github.ref }}
  cancel-in-progress: true

jobs:
  # --- known vulnerabilities (blocking) ------------------------------------
  vulnerabilities:
    name: Vulnerabilities (npm audit · pip-audit)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: ${{ !vars.CI_RUNNER && 'npm' || '' }}
      - run: npm ci
      # Production deps only, fail on high/critical (dev-tool advisories don't
      # reach users). Downgrade to `moderate` once the baseline is clean if you
      # want a tighter gate.
      # Wrapper, not raw `npm audit`: advisories with no fix in UNREACHABLE deps
      # (see scripts/check-audit.mjs ALLOW list - written reason + expiry each)
      # must not keep the gate permanently red. A gate that is red for known
      # reasons trains people to ignore red, and real advisories then sit
      # unnoticed behind the known ones.
      - name: npm audit (production, with documented exceptions)
        run: node scripts/check-audit.mjs
      # Catches what `npm audit` structurally cannot: a compromised-maintainer
      # or typosquat release pulled in before any advisory exists. Was
      # `minimumReleaseAge` in bunfig.toml, which never ran (nothing here uses
      # bun) - see the header of the script.
      - name: Minimum release age (production deps)
        run: node scripts/check-release-age.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # pip-audit reads the requirements file directly (no heavy install) and
      # checks it against the OSV / PyPI advisory databases.
      - name: pip-audit (backend requirements)
        run: |
          python -m pip install --upgrade pip pip-audit
          # The two spaCy models are pinned to official explosion release
          # wheels by URL. They are not PyPI distributions, so pip-audit says
          # "Dependency not found on PyPI and could not be audited" and
          # --strict makes that fatal although it is not a vulnerability.
          # Auditing them via PyPI is impossible by
          # construction, so they are filtered here rather than by dropping
          # --strict, which would also silence genuinely unauditable deps.
          grep -v '^https://' quon-scrubber-service/requirements.txt > /tmp/req-pypi.txt
          # No per-advisory ignores here. Any advisory fails this job, which
          # is the point of --strict; the fix belongs in requirements.txt
          # (cryptography is floored there at a patched release), not in an
          # ignore list.
          pip-audit -r /tmp/req-pypi.txt --strict

  # --- OSV-Scanner: unified OSV report across all lockfiles (blocking) ------
  osv-scanner:
    name: OSV-Scanner (all lockfiles)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Official OSV-Scanner action - note the SUB-PATH. The repository ROOT
      # carries an action.yml with name/description/branding but no `runs:`
      # section, so `google/osv-scanner-action@vX` resolves and then fails with
      #   Top level 'runs:' section is required for .../action.yml
      # which reads like a bad ref and is not one. Dependabot bumps the tag
      # happily; it cannot know the path is wrong.
      #
      # No `--skip-git`: v2 removed the flag, and an unknown flag makes the
      # binary exit 127 ("flag provided but not defined") before it scans
      # anything, a red run that looks like a finding. Skipping the root git
      # repo is the v2 default (`--include-git-root` opts back in).
      - uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --recursive
            --config=osv-scanner.toml
            ./

  # --- license compliance (blocking on strong copyleft) --------------------
  licenses:
    name: Licenses (npm · pip)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: ${{ !vars.CI_RUNNER && 'npm' || '' }}
      - run: npm ci
      # Full report as an artifact + a hard gate on strong/network copyleft
      # (GPL/AGPL/SSPL) reaching the shipped frontend. LGPL/MPL are reported but
      # not failed (weak copyleft is fine for this use); review the artifact.
      - name: npm license inventory
        run: npx --yes license-checker --production --summary > npm-licenses.txt || true
      # --excludePrivatePackages: the gate judges DEPENDENCIES. The root package
      # is private:true, and in the public edition it is itself AGPL-3.0 - without
      # this flag the gate would fail on the project's own licence.
      - name: npm license gate (no GPL/AGPL/SSPL in production)
        run: |
          npx --yes license-checker --production --excludePrivatePackages --failOn \
            'GPL-2.0;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0;GPL-3.0-only;GPL-3.0-or-later;AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later;SSPL-1.0'
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: ${{ !vars.CI_RUNNER && 'pip' || '' }}
          cache-dependency-path: quon-scrubber-service/requirements.txt
      # pip-licenses reads INSTALLED packages, so install the runtime deps first.
      - name: install backend runtime deps
        run: pip install -r quon-scrubber-service/requirements.txt pip-licenses
      # --partial-match: without it pip-licenses compares the whole licence
      # string, so "MPL-1.1 OR GPL-2.0-only OR LGPL-2.1-or-later" (tld, via
      # presidio-analyzer and courlan) passes a 'GPL' gate unseen.
      # tld is ignored by name because QUON elects its MPL-1.1 option.
      - name: pip license inventory + gate
        run: |
          pip-licenses --format=markdown --output-file python-licenses.md
          pip-licenses --partial-match --fail-on 'GPL;AGPL;SSPL' --ignore-packages tld
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: license-inventory
          path: |
            npm-licenses.txt
            python-licenses.md
          retention-days: 30

  # --- SBOM artifact (CycloneDX, whole repo) -------------------------------
  sbom:
    name: SBOM (CycloneDX via Syft)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # anchore/sbom-action wraps Syft; scans npm + pip from source and emits a
      # CycloneDX document. Uploaded as a build artifact (and attached to the run).
      # `upload-artifact: false`, so the action only writes the file and the
      # guarded step below is the single upload. Left to itself the action
      # uploads the SBOM too (omitting `artifact-name:` does not stop it): the
      # job then holds two copies of the same 5 MB document at 90-day
      # retention, and a storage-quota failure inside the action fails the job
      # before the continue-on-error upload below ever runs.
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: quon-sbom.cyclonedx.json
          upload-artifact: false
      # continue-on-error: "Artifact storage quota has been hit" must not turn
      # a successful scan into a red job, a storage problem masquerading as a
      # compliance failure. The scan verdict is the gate; the artifact is
      # evidence, and missing evidence is a warning, not a fail.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: sbom-cyclonedx
          path: quon-sbom.cyclonedx.json
          retention-days: 90
