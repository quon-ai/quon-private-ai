# Developer Certificate of Origin: every commit in a pull request carries a
# Signed-off-by line (git commit -s). No bot, no app install, no secrets —
# read-only token, one git log. See CONTRIBUTING.md, "License of contributions".
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: Signed-off-by on every commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE".."$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $c has no Signed-off-by line — git commit -s (see CONTRIBUTING.md)"
              missing=$((missing + 1))
            fi
          done
          [ "$missing" -eq 0 ] && echo "every commit is signed off" || exit 1
