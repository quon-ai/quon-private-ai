name: Housekeeping

# Keep CI's own leftovers bounded, so they cannot break CI.
#
# Two kinds of leftover do that, and both times the symptom points somewhere
# else entirely:
#   - a runner-side cache that grows by gigabytes, which `cache: pip` then
#     tries to upload over a slow uplink until the job dies on its timeout,
#     every run;
#   - Playwright reports uploaded after every green run, until "Artifact
#     storage quota has been hit" turns a passing E2E suite into a red job. A
#     storage problem manufacturing a test verdict.
#
# Both are fixed at the source (no cache round-trips on the self-hosted runner;
# the report uploads only on failure). This is the second line: caps that hold
# even when a future change starts producing junk again. Bounded by count, not
# by age: gigabytes accrue in days, so an age rule finds every file "recent"
# and deletes nothing.
#
# runs-on: ubuntu-latest, hardcoded, like ci-heartbeat.yml. Housekeeping that
# only runs when the machine being kept clean is healthy is not housekeeping.
# It is API calls only - seconds of hosted time.

on:
  schedule:
    - cron: "41 3 * * *" # daily, off the hour
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted, delete nothing"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # required to delete artifacts

concurrency:
  group: housekeeping
  cancel-in-progress: true

jobs:
  artifacts:
    name: Prune CI artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/prune-artifacts.mjs
