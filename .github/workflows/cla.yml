# Contributor License Agreement (CLA.md): a pull request from someone who has
# not signed gets a comment with the sign sentence and a failing "CLA signed"
# check. Signing is one PR comment, once; the signature (GitHub login and id,
# PR number, date, agreement version) lands on the cla-signatures branch of
# this repository. No third-party service, no secret: the action runs with
# the built-in token.
#
# pull_request_target on purpose: the job runs in the BASE repository with
# write access so it can comment and set the status on pull requests from
# forks. It must never check out or execute pull-request code, and it does
# not. The repository condition keeps the job out of private mirrors of this
# tree, where there are no outside contributors.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA signed
    if: >-
      github.repository == 'quon-ai/quon-private-ai' &&
      (github.event_name == 'pull_request_target' ||
       github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/quon-ai/quon-private-ai/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot],bot*
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thank you for the pull request. Before it can be merged, QUON needs
            your signature under its Contributor License Agreement, CLA.md in
            this repository: you keep your copyright and grant the project
            owner a licence that includes distributing QUON under other terms.
            Please read it and, if you agree, reply with the exact sentence
            below. One signature covers all your future contributions.
          custom-allsigned-prcomment: >-
            All contributors have signed the Contributor License Agreement.
            Thank you.
